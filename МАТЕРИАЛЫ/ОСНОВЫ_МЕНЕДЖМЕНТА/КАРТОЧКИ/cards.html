<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки — RUFLO УРОК</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#000; color:#fff; font-family:'Segoe Print','Comic Sans MS',cursive; }
  header{ padding:16px 18px 8px; border-bottom:2px solid #1e3a8a; }
  header h1{ font-size:22px; margin:0 0 6px; color:#fff; font-family:inherit; }
  .meta{ font-size:15px; color:#93c5fd; }
  .progress{ font-size:16px; color:#facc15; margin-top:6px; }
  main{ padding:14px 14px 60px; max-width:900px; margin:0 auto; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; align-items:center; }
  .btn{ font-size:16px; padding:12px 18px; border-radius:10px; border:2px solid #1e40af; background:#fff; color:#1e3a8a; cursor:pointer; font-family:inherit; }
  .btn.primary{ background:#1e40af; color:#fff; }
  .btn.warn{ background:#f59e0b; color:#1e1000; border-color:#f59e0b; }
  .btn[hidden]{ display:none; }
  .board{ display:flex; flex-direction:column; gap:14px; margin-bottom:22px; }
  .row{ display:flex; flex-wrap:wrap; gap:12px; background:#0a0a0a; border:2px solid #1e3a8a; border-radius:10px; padding:14px; }
  .question{ flex:1 1 100%; font-size:20px; color:#fff; }
  .dropzone{ flex:1 1 100%; min-height:56px; border:3px dashed #1e40af; border-radius:10px; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; font-size:18px; color:#93c5fd; cursor:pointer; text-align:center; gap:4px; }
  .dropzone.dragover{ background:#0f1f4a; }
  .dropzone.filled{ border-style:solid; color:#fff; }
  .dropzone.correct{ border-color:#16a34a; background:#052e12; color:#4ade80; }
  .dropzone.incorrect{ border-color:#dc2626; background:#2e0505; color:#f87171; }
  .zone-status{ font-size:15px; font-weight:bold; }
  .cardsource{ border-top:2px dashed #1e3a8a; padding-top:16px; }
  .cardsource-label{ font-size:16px; color:#93c5fd; margin-bottom:10px; }
  .cardpool{ display:flex; flex-wrap:wrap; gap:12px; }
  .card{ min-width:150px; max-width:100%; flex:1 1 auto; padding:14px 18px; background:#fff; border:3px solid #1e40af; border-radius:12px; font-size:18px; color:#1e3a8a; cursor:grab; user-select:none; box-shadow:2px 3px 0 #1e3a8a; }
  .card.used{ opacity:0.3; pointer-events:none; }
  .card.selected{ box-shadow:0 0 0 3px #f59e0b; }
  .backlink{ display:inline-block; margin:14px 0; color:#93c5fd; font-size:15px; text-decoration:none; }
  .results{ display:none; border:3px solid #93c5fd; border-radius:14px; padding:18px 20px; margin:16px 0 22px; background:#050d1f; }
  .results.show{ display:block; }
  .results h2{ margin:0 0 10px; font-size:24px; color:#fff; }
  .results .line{ font-size:19px; margin:4px 0; }
  .results .grade{ font-size:26px; font-weight:bold; color:#facc15; margin-top:8px; }
  .profile{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
  .profile input{ font-size:15px; padding:8px 10px; border-radius:8px; border:2px solid #1e3a8a; background:#000; color:#fff; font-family:inherit; flex:1 1 200px; }
  .avn-block{ display:none; border:3px solid #16a34a; border-radius:14px; padding:18px 20px; margin:0 0 22px; background:#04150a; }
  .avn-block.show{ display:block; }
  .avn-block h2{ margin:0 0 12px; font-size:24px; color:#4ade80; }
  .avn-block .line{ font-size:17px; margin:4px 0; }
  .avn-block .line b{ color:#93c5fd; }
  .avn-toolbar{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .btn.avn{ background:#0d3b66; border-color:#3a7bd5; color:#fff; }
  .btn.copy{ background:#374151; border-color:#6b7280; color:#fff; }
  @media (max-width:480px){ .question, .dropzone, .card{ font-size:17px; } .card{ min-width:120px; } }
</style>
</head>
<body>
<header>
  <h1>✍️ Карточки — вопрос и ответ</h1>
  <div class="meta" id="meta">Загрузка…</div>
  <div class="progress" id="progress"></div>
</header>
<main>
  <a class="backlink" href="../../../student.html">← Назад к теме</a>
  <div class="profile">
    <input type="text" id="profName" placeholder="Ф.И.О. (необязательно)">
    <input type="text" id="profGroup" placeholder="Группа (необязательно)">
  </div>
  <div class="toolbar">
    <button class="btn" id="btnShuffle">🔀 Перемешать</button>
    <button class="btn" id="btnReset">↻ Сбросить всё</button>
    <button class="btn primary" id="btnCheck">✅ Проверить ответы</button>
    <button class="btn warn" id="btnFixErrors" hidden>🔄 Исправить ошибки</button>
  </div>
  <div class="results" id="results">
    <h2>РЕЗУЛЬТАТ</h2>
    <div class="line" id="resLineCorrect"></div>
    <div class="line" id="resLineWrong"></div>
    <div class="line" id="resLineUnanswered"></div>
    <div class="line" id="resLinePercent"></div>
    <div class="grade" id="resGrade"></div>
  </div>
  <div class="avn-block" id="avnBlock">
    <h2>✅ ЗАДАНИЕ ВЫПОЛНЕНО</h2>
    <div class="line"><b>Студент:</b> <span id="avnName"></span></div>
    <div class="line"><b>Группа:</b> <span id="avnGroup"></span></div>
    <div class="line"><b>Дисциплина:</b> <span id="avnDiscipline"></span></div>
    <div class="line"><b>Тема:</b> <span id="avnTopic"></span></div>
    <div class="line"><b>Результат:</b> <span id="avnResult"></span></div>
    <div class="line"><b>Дата:</b> <span id="avnDate"></span></div>
    <div class="avn-toolbar">
      <button class="btn copy" id="btnCopyResult">📋 СКОПИРОВАТЬ РЕЗУЛЬТАТ</button>
      <button class="btn copy" id="btnDownloadAnswer">📄 СКАЧАТЬ ОТВЕТ</button>
      <a class="btn avn" id="btnOpenAvn" href="https://avn.iku.kg/" target="_blank" rel="noopener">🎓 ОТКРЫТЬ МОЙ AVN</a>
    </div>
    <p class="line" id="avnCopyStatus" style="margin-top:10px;color:#4ade80"></p>
  </div>
  <div class="board" id="board"></div>
  <div class="cardsource">
    <div class="cardsource-label">Перетащите карточку к вопросу, или нажмите карточку — затем поле ответа:</div>
    <div class="cardpool" id="cardpool"></div>
  </div>
</main>
<script>
(function(){
  'use strict';
  const params = new URLSearchParams(location.search);
  const dataFile = params.get('data') || 'cards_data_tema01.json';
  const GRADING_CONFIG_URL = '../../_CONFIG/handwriting_grading.json';
  const DEFAULT_SCALE = [
    { min: 90, max: 100, grade: 5 },
    { min: 75, max: 89,  grade: 4 },
    { min: 60, max: 74,  grade: 3 },
    { min: 0,  max: 59,  grade: 2 }
  ];
  let gradingScale = DEFAULT_SCALE;

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function gradeForPercent(pct){
    const band = gradingScale.find(b => pct >= b.min && pct <= b.max);
    return band ? band.grade : gradingScale[gradingScale.length - 1].grade;
  }

  let questions = [];
  let topicMeta = { discipline: '', topic_number: '', topic_title: '' };
  let storageKey = 'ruflo_student_cards_' + dataFile;

  // ===== RUFLO STUDENT AVN SUBMISSION =====
  // Ф.И.О./группа вводятся студентом сам, ОДИН РАЗ, и хранятся только в его
  // собственном браузере (localStorage) — RUFLO их никуда не отправляет и не
  // хранит на сервере. Логин/пароль/cookies/session AVN нигде не запрашиваются
  // и не сохраняются — кнопка «Открыть мой AVN» это просто внешняя ссылка,
  // студент входит в свой AVN сам и сам решает, что туда вставить/загрузить.
  const PROFILE_KEY = 'ruflo_student_profile';
  function loadProfile(){
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; } catch(e){ return {}; }
  }
  function saveProfile(){
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify({
        name: document.getElementById('profName').value.trim(),
        group: document.getElementById('profGroup').value.trim()
      }));
    } catch(e){}
  }

  function buildResultLine(correct, total, pct, grade){
    return `${correct} из ${total} (${pct}%, оценка ${grade})`;
  }
  function todayStr(){ return new Date().toLocaleDateString('ru-RU'); }

  function buildResultText(correct, total, pct, grade){
    const p = loadProfile();
    return `RUFLO УРОК\n` +
      `Ф.И.О.: ${p.name || '—'}\n` +
      `Группа: ${p.group || '—'}\n` +
      `Дисциплина: ${topicMeta.discipline}\n` +
      `Тема №${topicMeta.topic_number}: ${topicMeta.topic_title}\n` +
      `Задание: ✍️ Карточки — вопрос и ответ\n` +
      `Результат: ${buildResultLine(correct, total, pct, grade)}\n` +
      `Дата: ${todayStr()}`;
  }
  function buildAnswerText(correct, total, pct, grade){
    const p = loadProfile();
    const lines = [
      `Ф.И.О.: ${p.name || '—'}`,
      `Группа: ${p.group || '—'}`,
      `Дисциплина: ${topicMeta.discipline}`,
      `Тема №${topicMeta.topic_number}: ${topicMeta.topic_title}`,
      `Задание: ✍️ Карточки — вопрос и ответ`,
      ``,
      `Ответ:`
    ];
    questions.forEach((q, i) => {
      const placedId = state.placements[q.id];
      const given = placedId ? questionById(placedId).answer : '(не отвечено)';
      const mark = state.checked ? (placedId === q.id ? ' [верно]' : ' [неверно]') : '';
      lines.push(`${i + 1}. ${q.text}`);
      lines.push(`   Ответ студента: ${given}${mark}`);
    });
    lines.push(``, `Результат: ${buildResultLine(correct, total, pct, grade)}`, `Дата: ${todayStr()}`);
    return lines.join('\n');
  }

  function updateAvnBlock(correct, total, pct, grade){
    const block = document.getElementById('avnBlock');
    if (!state.checked){ block.classList.remove('show'); return; }
    const p = loadProfile();
    document.getElementById('avnName').textContent = p.name || '—';
    document.getElementById('avnGroup').textContent = p.group || '—';
    document.getElementById('avnDiscipline').textContent = topicMeta.discipline;
    document.getElementById('avnTopic').textContent = `№${topicMeta.topic_number}: ${topicMeta.topic_title}`;
    document.getElementById('avnResult').textContent = buildResultLine(correct, total, pct, grade);
    document.getElementById('avnDate').textContent = todayStr();
    block.classList.add('show');
  }
  // state.checked: false | true (после «Проверить»). state.attempts — сколько раз
  // нажата «✅ Проверить ответы» (для учителя/статистики; «Исправить ошибки»
  // повторную попытку не засчитывает, пока студент не проверит снова).
  let state = { order: [], placements: {}, checked: false, attempts: 0 };
  let selectedCardId = null;

  function loadProgress(){
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function saveProgress(){
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch(e){}
  }
  function questionById(id){ return questions.find(q=>q.id===id); }

  function updateProgress(){
    const filled = Object.values(state.placements).filter(Boolean).length;
    document.getElementById('progress').textContent = `Заполнено: ${filled} / ${questions.length}`;
  }

  let lastResult = null; // {correct, total, pct, grade} — для кнопок копировать/скачать
  function updateResults(){
    const panel = document.getElementById('results');
    const fixBtn = document.getElementById('btnFixErrors');
    if (!state.checked){
      panel.classList.remove('show');
      fixBtn.hidden = true;
      updateAvnBlock();
      return;
    }
    const total = questions.length;
    const answered = Object.values(state.placements).filter(Boolean).length;
    const correct = questions.filter(q => state.placements[q.id] === q.id).length;
    const wrong = answered - correct;
    const unanswered = total - answered;
    const pct = total ? Math.round((correct / total) * 100) : 0;
    const grade = gradeForPercent(pct);
    lastResult = { correct, total, pct, grade };

    document.getElementById('resLineCorrect').textContent = `Правильно: ${correct} из ${total}`;
    document.getElementById('resLineWrong').textContent = `Ошибок: ${wrong}`;
    document.getElementById('resLineUnanswered').textContent = `Не отвечено: ${unanswered}`;
    document.getElementById('resLinePercent').textContent = `Результат: ${pct}%`;
    document.getElementById('resGrade').textContent = `Оценка: ${grade}`;
    panel.classList.add('show');
    fixBtn.hidden = (wrong === 0 && unanswered === 0);
    updateAvnBlock(correct, total, pct, grade);
  }

  function render(){
    const board = document.getElementById('board');
    const pool = document.getElementById('cardpool');
    board.innerHTML = '';
    questions.forEach(q=>{
      const row = document.createElement('div');
      row.className = 'row';
      const question = document.createElement('div');
      question.className = 'question';
      question.textContent = q.text;
      const zone = document.createElement('div');
      zone.className = 'dropzone';
      zone.dataset.questionId = q.id;
      const placedId = state.placements[q.id];
      const answerLine = document.createElement('div');
      answerLine.textContent = placedId ? questionById(placedId).answer : 'Перетащите или выберите карточку';
      zone.appendChild(answerLine);
      if (placedId) zone.classList.add('filled');
      if (state.checked && placedId){
        const isCorrect = placedId === q.id;
        zone.classList.add(isCorrect ? 'correct' : 'incorrect');
        const status = document.createElement('div');
        status.className = 'zone-status';
        status.textContent = isCorrect ? '✅ Верно' : '❌ Неверно';
        zone.appendChild(status);
      }
      row.appendChild(question);
      row.appendChild(zone);
      board.appendChild(row);
    });

    pool.innerHTML = '';
    const used = Object.values(state.placements).filter(Boolean);
    state.order.forEach(answerId=>{
      const q = questionById(answerId);
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.answerId = answerId;
      card.textContent = q.answer;
      card.setAttribute('draggable', 'true');
      if (used.includes(answerId)) card.classList.add('used');
      if (selectedCardId === answerId) card.classList.add('selected');
      pool.appendChild(card);
    });

    updateProgress();
    updateResults();
    saveProgress();
  }

  function placeAnswer(questionId, answerId){
    Object.keys(state.placements).forEach(qid=>{
      if (state.placements[qid] === answerId) state.placements[qid] = null;
    });
    state.placements[questionId] = answerId;
    selectedCardId = null;
    render();
  }
  function clearZone(questionId){
    state.placements[questionId] = null;
    render();
  }

  document.addEventListener('dragstart', (e)=>{
    const card = e.target.closest('.card');
    if (!card || card.classList.contains('used')) return;
    e.dataTransfer.setData('text/plain', card.dataset.answerId);
    e.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover', (e)=>{
    const zone = e.target.closest('.dropzone');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('dragover');
  });
  document.addEventListener('dragleave', (e)=>{
    const zone = e.target.closest('.dropzone');
    if (zone) zone.classList.remove('dragover');
  });
  document.addEventListener('drop', (e)=>{
    const zone = e.target.closest('.dropzone');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('dragover');
    const answerId = e.dataTransfer.getData('text/plain');
    if (answerId) placeAnswer(zone.dataset.questionId, answerId);
  });

  let touchDragId = null;
  document.addEventListener('touchstart', (e)=>{
    const card = e.target.closest('.card');
    if (!card || card.classList.contains('used')) return;
    touchDragId = card.dataset.answerId;
  }, { passive: true });
  document.addEventListener('touchmove', (e)=>{
    if (!touchDragId) return;
    const t = e.touches[0];
    document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('dragover'));
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const zone = el && el.closest('.dropzone');
    if (zone) zone.classList.add('dragover');
  }, { passive: true });
  document.addEventListener('touchend', (e)=>{
    if (!touchDragId) return;
    const t = e.changedTouches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const zone = el && el.closest('.dropzone');
    document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('dragover'));
    if (zone) placeAnswer(zone.dataset.questionId, touchDragId);
    touchDragId = null;
  });

  document.addEventListener('click', (e)=>{
    const card = e.target.closest('.card');
    const zone = e.target.closest('.dropzone');
    if (card && !card.classList.contains('used')){
      selectedCardId = (selectedCardId === card.dataset.answerId) ? null : card.dataset.answerId;
      render();
      return;
    }
    if (zone){
      if (selectedCardId){
        placeAnswer(zone.dataset.questionId, selectedCardId);
      } else if (zone.classList.contains('filled')){
        clearZone(zone.dataset.questionId);
      }
    }
  });

  document.getElementById('btnShuffle').addEventListener('click', ()=>{
    state.order = shuffle(state.order);
    render();
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    questions.forEach(q=>{ state.placements[q.id] = null; });
    state.checked = false;
    selectedCardId = null;
    render();
  });
  document.getElementById('btnCheck').addEventListener('click', ()=>{
    state.checked = true;
    state.attempts = (state.attempts || 0) + 1;
    render();
  });
  document.getElementById('btnFixErrors').addEventListener('click', ()=>{
    // Правильные пары остаются; неправильные и пустые освобождаются —
    // студент выбирает ответы для них заново.
    questions.forEach(q=>{
      if (state.placements[q.id] !== q.id) state.placements[q.id] = null;
    });
    state.checked = false;
    selectedCardId = null;
    render();
  });

  // Профиль студента (ФИО/группа) — только в его собственном localStorage.
  (function initProfile(){
    const p = loadProfile();
    document.getElementById('profName').value = p.name || '';
    document.getElementById('profGroup').value = p.group || '';
    document.getElementById('profName').addEventListener('change', saveProfile);
    document.getElementById('profGroup').addEventListener('change', saveProfile);
  })();

  document.getElementById('btnCopyResult').addEventListener('click', async () => {
    if (!lastResult) return;
    const text = buildResultText(lastResult.correct, lastResult.total, lastResult.pct, lastResult.grade);
    const statusEl = document.getElementById('avnCopyStatus');
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = '✅ Результат скопирован — вставьте его в AVN.';
    } catch (e) {
      statusEl.textContent = '⚠ Не удалось скопировать автоматически — выделите и скопируйте текст вручную.';
    }
  });

  document.getElementById('btnDownloadAnswer').addEventListener('click', () => {
    if (!lastResult) return;
    const text = buildAnswerText(lastResult.correct, lastResult.total, lastResult.pct, lastResult.grade);
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const p = loadProfile();
    const namePart = (p.name || 'student').replace(/[^\p{L}\p{N}_-]+/gu, '_').slice(0, 40);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Ответ_Тема${topicMeta.topic_number}_${namePart}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  fetch(GRADING_CONFIG_URL).then(r => r.ok ? r.json() : null).then(cfg => {
    if (cfg && Array.isArray(cfg.scale) && cfg.scale.length) gradingScale = cfg.scale;
  }).catch(()=>{}).finally(()=>{
    fetch(dataFile).then(r=>r.json()).then(data=>{
      questions = data.questions || [];
      topicMeta = { discipline: data.discipline || '', topic_number: data.topic_number || '', topic_title: data.topic_title || '' };
      document.getElementById('meta').textContent =
        `${data.discipline || ''} · Тема ${data.topic_number || ''}: ${data.topic_title || ''} · ${questions.length} вопросов`;
      document.title = 'Карточки — ' + (data.topic_title || 'RUFLO УРОК');
      state = loadProgress() || { order: shuffle(questions.map(q=>q.id)), placements: {}, checked: false, attempts: 0 };
      if (typeof state.attempts !== 'number') state.attempts = 0;
      questions.forEach(q=>{ if (!(q.id in state.placements)) state.placements[q.id] = null; });
      render();
    }).catch(err=>{
      document.getElementById('meta').textContent = 'Не удалось загрузить задание: ' + err.message;
    });
  });
})();
</script>
</body>
</html>
